<!DOCTYPE html>
<html lang="ja">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&amp;display=swap" rel="stylesheet"/>
  <title>
   乃木フェス イベントシミュレーター
  </title>
  <link href="icon-32.png" rel="icon" sizes="32x32" type="image/png"/>
  <link href="icon-180.png" rel="apple-touch-icon"/>
  <script>
   if (location.protocol === "http:" || location.protocol === "https:") { const manifestLink = document.createElement("link"); manifestLink.rel = "manifest"; manifestLink.href = "manifest.webmanifest"; document.head.appendChild(manifestLink); }
  </script>
  <meta content="yes" name="apple-mobile-web-app-capable"/>
  <meta content="乃木フェス" name="apple-mobile-web-app-title"/>
  <meta content="#6a3fd6" name="theme-color"/>
  <link href="style.css" rel="stylesheet"/>
 </head>
 <body>
  <div class="app">
   <nav aria-label="画面切り替え" class="nav" id="nav">
    <button data-page="play">
     <small>
      プレイ
     </small>
    </button>
    <button data-page="result">
     <small>
      Result
     </small>
    </button>
    <button data-page="settings">
     <small>
      設定
     </small>
    </button>
   </nav>
   <header class="banner">
    <h1>
     乃木フェス イベントシミュレーター
    </h1>
    <div id="subtitle">
     初期設定画面
    </div>
   </header>
   <main id="content">
   </main>
  </div>
  <div class="modal" hidden="" id="wheelModal">
   <div class="dialog">
    <h2 id="wheelTitle">
     時間を設定
    </h2>
    <div class="wheel-grid">
     <label>
      時間
      <select id="wh">
      </select>
     </label>
     <label>
      分
      <select id="wm">
      </select>
     </label>
     <label id="wsWrap">
      秒
      <select id="ws">
      </select>
     </label>
    </div>
    <div class="actions">
     <button class="ghost" id="wheelCancel">
      キャンセル
     </button>
     <button class="primary" id="wheelOk">
      決定
     </button>
    </div>
   </div>
  </div>
  <div class="modal" hidden="" id="confirmModal">
   <div class="dialog">
    <h2>
     イベントを終了しますか？
    </h2>
    <p>
     現在のイベントの設定・結果・セット履歴は削除されます。この操作は取り消せません。
    </p>
    <div class="actions">
     <button class="ghost" id="endCancel">
      キャンセル
     </button>
     <button class="danger" id="endOk">
      イベント終了
     </button>
    </div>
   </div>
  </div>
  <script src="script.js">
  </script>
 </body>
</html>
