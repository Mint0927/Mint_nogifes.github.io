
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>乃木フェス計算ツール</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <main class="container">

    <!-- タイトル -->
    <header class="title-banner">
      <h1>乃木フェス計算ツール</h1>
    </header>

    <!-- プレイ用途 -->
    <section class="mode-box">
      <span class="mode-title">プレイ用途：</span>

      <label class="radio-label">
        <input type="radio" name="playMode" value="manual" checked>
        <span>手打ち</span>
      </label>

      <label class="radio-label">
        <input type="radio" name="playMode" value="background">
        <span>バックグラウンド</span>
      </label>
    </section>

    <!-- 通常曲・イベント曲 -->
    <div class="song-grid">

      <!-- 通常曲 -->
      <section class="panel">
        <h2 class="panel-title">
          <span>♫</span> 通常曲
        </h2>

        <div class="panel-content">
          <div class="form-row">
            <label for="normalSong">曲選択：</label>
            <select id="normalSong"></select>
          </div>

          <div class="form-row">
            <label>曲時間：</label>
            <div class="time-inputs">
              <input type="number" id="normalMin" readonly>
              <span>分</span>
              <input type="number" id="normalSec" readonly>
              <span>秒</span>
            </div>
          </div>
        </div>
      </section>

      <!-- イベント曲 -->
      <section class="panel">
        <h2 class="panel-title">
          <span>♫</span> イベント曲
        </h2>

        <div class="panel-content">
          <div class="form-row">
            <label>曲時間：</label>
            <div class="time-inputs">
              <input type="number" id="eventMin" min="0" placeholder="0">
              <span>分</span>
              <input type="number" id="eventSec" min="0" max="59" placeholder="0">
              <span>秒</span>
            </div>
          </div>

          <div class="bonus-row">
            <div class="bonus-input">
              <label for="bonus">特攻値：</label>
              <div>
                <input type="number" id="bonus" min="0" max="10000" value="0">
                <span>%</span>
              </div>
            </div>

            <span class="arrow">➜</span>

            <div class="event-point">
              <label>イベントpt：</label>
              <output id="eventPoint">pt</output>
            </div>
          </div>
        </div>
      </section>
    </div>

    <!-- 精度設定 -->
    <section class="panel accuracy-panel" id="accuracyArea">
      <h2 class="panel-title">精度</h2>

      <div class="accuracy-grid">
        <div class="accuracy-item">
          <label for="フルエク">フルエク</label>
          <select id="フルエク"></select>
        </div>

        <div class="accuracy-item">
          <label for="フルコン">フルコン</label>
          <select id="フルコン"></select>
        </div>

        <div class="accuracy-item">
          <label for="Aコン">Aコン</label>
          <select id="Aコン"></select>
        </div>

        <div class="accuracy-item">
          <label for="Bコン">Bコン</label>
          <select id="Bコン"></select>
        </div>

        <div class="accuracy-item">
          <label for="Cコン">Cコン</label>
          <select id="Cコン"></select>
        </div>

        <div class="accuracy-item">
          <label for="Dコン">Dコン</label>
          <select id="Dコン"></select>
        </div>
      </div>
    </section>

    <!-- 計算ボタン -->
    <button id="calc" class="calc-button">計算する</button>

    <!-- Result -->
    <section id="results" class="panel result-panel">
      <h2 class="panel-title">Result</h2>

      <div class="result-content">
        <div class="result-summary">

          <div class="summary-item">
            <span>プレイ方法</span>
            <strong id="resultMode">手打ち</strong>
          </div>

          <div class="summary-item">
            <span>選択曲</span>
            <strong id="resultSong">-</strong>
          </div>

          <div class="summary-item">
            <span>平均アイテム数</span>
            <strong id="resultAverage">0.00 個</strong>
          </div>

          <div class="summary-item">
            <span>通常曲の計算時間</span>
            <strong id="resultNormalTime">0時間 0分 0秒</strong>
          </div>

          <div class="summary-item">
            <span>イベント曲の計算時間</span>
            <strong id="resultEventTime">0時間 0分 0秒</strong>
          </div>

        </div>

        <div class="result-bottom">

          <div class="result-card">
            <h3>1日換算</h3>
            <p>
              セット数：
              <strong id="resultDaySet">0.00</strong> セット
            </p>
            <p>
              1日獲得pt：
              <strong id="resultDayPoint">0</strong> pt
            </p>
          </div>

          <div class="result-card">
            <h3>イベント全体（225時間）</h3>
            <p>
              セット数：
              <strong id="result225Set">0.00</strong> セット
            </p>
            <p>
              推定イベント全体pt：
              <strong id="result225Point">0</strong> pt
            </p>
          </div>

        </div>
      </div>
    </section>

  </main>
</body>
</html>
